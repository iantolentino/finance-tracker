<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>try { if (localStorage.getItem("pfms-theme") === "light") document.documentElement.classList.remove("dark"); } catch (_) { /* default dark */ }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PFMS - Personal Finance Management System</title>
    <meta name="description" content="Track SPayLater receivables, cash loans, and a monthly budget." />
    <!-- Default (light) value - kept in sync with the in-app toggle at runtime
         in App.tsx, since theme is a manual user choice, not just OS preference. -->
    <meta name="theme-color" content="#111028" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
